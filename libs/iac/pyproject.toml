[project]
name = "iac"
version = "0.1.0"
description = "IaC and CI results: tool-output normalizers, the CI workflow rules, the results-only upload contract"
requires-python = ">=3.13,<3.14"
dependencies = ["pyyaml>=6.0,<7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["../.."]
include = ["libs/iac"]
